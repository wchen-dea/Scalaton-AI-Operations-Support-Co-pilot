# Databricks App manifest — Agentic AI Operations Support System.
#
# This app installs and runs the wheel in `dist/`. The wheel contains the backend and
# the built frontend assets; source directories are not required at runtime.
#
# Invariants honored here (databricks-apps):
#  - The app binds the injected DATABRICKS_APP_PORT at runtime. `python -m app` reads it
#    (see backend/app/__main__.py); the port is never hardcoded.
#  - Warehouses, Genie spaces, Unity Catalog securables, secrets, and peer apps are
#    referenced as named resources and injected via `valueFrom` — never pasted inline.
#  - External writes are disabled by default; enable them only in a governed environment.
#  - If a databricks.yml is added, deploy through Databricks Asset Bundles rather than
#    ad-hoc `databricks apps deploy`.

command:
  - "sh"
  - "-c"
  - "python -m pip install --disable-pip-version-check dist/ai_ops_support_backend-0.1.0-py3-none-any.whl && python -m app"

env:
  # Non-secret configuration (tech-arch §10). Names only — never secrets.
  - name: ENABLE_EXTERNAL_WRITES
    # Stays false in every environment until the PRD §7 Release 2 gate (governed change).
    value: "false"
  - name: USE_LIVE_INTEGRATIONS
    value: "false"
  - name: MODEL_ENDPOINT
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: MODEL_TIMEOUT_S
    value: "30"
  - name: UC_CATALOG
    value: "system"
  - name: UC_SCHEMA
    value: "workflow"
  - name: WEBHOOK_RATE_LIMIT_PER_MINUTE
    value: "60"
  - name: APPROVAL_POLICY
    value: "teams"

  # Resource- and secret-backed values, injected from the app resources declared in
  # resources/scalaton.app.yml (per-environment IDs and secret scope come from bundle
  # variables). valueFrom references the app resource by name.
  - name: SQL_WAREHOUSE_ID
    valueFrom: sql-warehouse
  - name: SERVICENOW_WEBHOOK_SECRET
    valueFrom: servicenow-webhook-secret
  - name: JIRA_WEBHOOK_SECRET
    valueFrom: jira-webhook-secret
  - name: SKYBOT_WEBHOOK_SECRET
    valueFrom: skybot-webhook-secret

  # Release 2 live-integration resources (stubbed in Release 1). Declare matching app
  # resources (genie_space / Vector Search index) in resources/scalaton.app.yml and
  # activate these when live integrations are enabled:
  # - name: VECTOR_SEARCH_INDEX
  #   valueFrom: vector-search-index
  # - name: GENIE_SPACE
  #   valueFrom: genie-space

# The matching resources (SQL warehouse, secret scope) are declared in
# resources/scalaton.app.yml and provisioned per environment by the platform owner.
