[project]
name = "ai-ops-support-backend"
version = "0.1.0"
description = "Agentic AI Operations Support System — FastAPI + LangGraph backend (scaffold)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "langgraph>=0.2.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
app = ["static/**/*"]

[project.optional-dependencies]
# Developer tooling for building and testing the scaffold with no live dependencies.
dev = ["pytest>=8"]
# Libraries required only when the stub adapters are replaced with live Databricks,
# MCP, and external-connector implementations. Not needed to build, run, or test the
# scaffold (plan decision D3).
live = [
    "databricks-sdk>=0.30",
    "databricks-sql-connector>=3.0",
    "langchain-mcp-adapters>=0.1",
    "mcp>=1.0",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
