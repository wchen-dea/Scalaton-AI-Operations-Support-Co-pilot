# Databricks Asset Bundle for the Agentic AI Operations Support System (Scalaton).
#
# Deploys the Databricks App defined in app.yaml (FastAPI backend serving the built
# frontend/dist) to four separate workspaces: dev, qa, stg, prod.
#
# Authentication: each target authenticates through the CLI environment or a profile.
# CI jobs export that environment's DATABRICKS_HOST plus OAuth DATABRICKS_CLIENT_ID /
# DATABRICKS_CLIENT_SECRET; local developers select a per-environment CLI profile.
# No workspace host or secret is committed here.

bundle:
  name: scalaton

include:
  - resources/*.yml
  - targets/*.yml

# source_code_path for the app resolves to the repository root. The app runtime only
# needs app.yaml and the wheel generated in dist/.
sync:
  include:
    - dist/*.whl
  exclude:
    - .github/**
    - .copilot-tracking/**
    - backend/**
    - docs/**
    - .env*
    - .databricks/**
    - frontend/**
    - "**/.venv/**"
    - "**/node_modules/**"
    - "**/__pycache__/**"
    - "**/.pytest_cache/**"
    - backend/tests/**

variables:
  app_name:
    description: "Databricks App name: lowercase letters, digits, hyphens; <=30 chars. Workspace-global, so distinct per environment."
  secret_scope:
    description: "Databricks secret scope holding this environment's connector webhook secrets and per-environment configuration keys."
  warehouse_id:
    description: "Serverless SQL warehouse ID used for governed diagnostics (tech-arch §5)."
    default: ""
  genie_space:
    description: "Genie space identifier (Release 2 live integrations; stubbed in Release 1)."
    default: ""
  vector_search_index:
    description: "Mosaic AI Vector Search index identifier (Release 2 live integrations; stubbed in Release 1)."
    default: ""
  uc_catalog:
    description: "Unity Catalog catalog name for this environment (provisioned per environment)."
    default: ""
  uc_schema:
    description: "Unity Catalog schema name for this environment (provisioned per environment)."
    default: ""
  enable_external_writes:
    description: "Feature flag for external writes. Stays false in every environment until the PRD-SCALATON-001 §7 Release 2 gate (enabled later by a governed change)."
    default: "false"
