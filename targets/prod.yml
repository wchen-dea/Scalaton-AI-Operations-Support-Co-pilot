# Production target values. Do not put credentials or secret values here.
targets:
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      app_name: scalaton-prod
      secret_scope: scalaton-prod
      warehouse_id: ""
      genie_space: ""
      vector_search_index: ""
      uc_catalog: ""
      uc_schema: ""
      enable_external_writes: "false"